<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540;
cv.width = W * 2; cv.height = H * 2; ctx.setTransform(2, 0, 0, 2, 0, 0);

const GRAV = 2200, JUMP = 790, JUMP2 = 700;
let twoP = false, mode2 = false, pickStage = 0, picks = [0, 0], G2 = [], res2 = null, VW = 960;

try {
  coins = +localStorage.getItem('rr_coins') || 0;
  const ow = localStorage.getItem('rr_owned');
  if (ow) ow.split('').forEach((c, i) => { if (i < 15) ownedArr[i] = c === '1'; });

const lvls = Array(15).fill(1);
try { const lv = localStorage.getItem('rr_lvls'); if (lv) lv.split('').forEach((c, i) => { if (i < 15) lvls[i] = clamp(+c || 1, 1, 5); }); } catch (e) {}
const UPG_COST = [0, 60, 120, 220, 380];   // cost to go from level N to N+1 is UPG_COST[N]
function saveWallet() {
  try { localStorage.setItem('rr_coins', String(coins)); localStorage.setItem('rr_owned', ownedArr.map(b => b ? '1' : '0').join('')); localStorage.setItem('rr_lvls', lvls.join('')); } catch (e) {}
}
function abMul(lv) { return 1 + 0.15 * (lv - 1); }
function levelStats(c, lv) {
  const o = Object.assign({}, c);
  o.lv = lv; o.abM = abMul(lv);
  o.ab = Object.assign({}, c.ab, { cd: Math.round(c.ab.cd * (1 - 0.06 * (lv - 1)) * 10) / 10 });
  o.style = c.style * (1 + 0.04 * (lv - 1));
  o.combo = c.combo + 0.15 * (lv - 1);
  o.coy = c.coy + 0.01 * (lv - 1);

/* ---------- key bindings + secret codes ---------- */
const ACTIONS = [['jump', 'Jump / double-jump'], ['slide', 'Slide / fast-fall'], ['ability', 'Special ability'], ['pause', 'Pause'], ['mute', 'Mute sound']];
const DEF_BINDS = { jump: [' ', 'ArrowUp'], slide: ['ArrowDown', 's'], ability: ['e', 'Shift'], pause: ['p', 'Escape'], mute: ['m', ''] };
let binds = JSON.parse(JSON.stringify(DEF_BINDS));
try {
  const raw = JSON.parse(localStorage.getItem('rr_binds') || 'null');
  if (raw) for (const a in DEF_BINDS) if (Array.isArray(raw[a]) && raw[a].length === 2) binds[a] = raw[a].map(x => typeof x === 'string' ? x : '');
} catch (e) {}
function saveBinds() { try { localStorage.setItem('rr_binds', JSON.stringify(binds)); } catch (e) {} }
const nk = k => k.length === 1 ? k.toLowerCase() : k;
const is = (k, a) => k !== '' && binds[a].includes(nk(k));
function keyName(k) {
  if (!k) return '—';
  return ({ ' ': 'SPACE', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Escape: 'ESC', Shift: 'SHIFT', Control: 'CTRL', Alt: 'ALT', Enter: 'ENTER', Tab: 'TAB', Backspace: 'BKSP' })[k] || k.toUpperCase();
}
const kn = a => keyName(binds[a][0] || binds[a][1]);
// player 1's key in versus mode: the arrow keys always belong to player 2
const kp1 = (a, fb) => keyName(binds[a].find(x => x && !x.startsWith('Arrow')) || fb);
function bindKey(action, slot, k) {
  const key = nk(k);
  for (const a in binds) binds[a].forEach((v, i) => { if (v === key) binds[a][i] = ''; });
  binds[action][slot] = key;
  for (const a in binds) if (!binds[a][0] && !binds[a][1]) binds[a] = DEF_BINDS[a].slice();
  saveBinds();
}
const CODES = { ihan: 100000 };
let usedCodes = {};
try { usedCodes = JSON.parse(localStorage.getItem('rr_codes') || '{}') || {}; } catch (e) {}
const codeIn = document.getElementById('codeIn');
let setRow = 0, setSlot = 0, listening = null, codeBuf = '', codeMsg = '', codeOk = false;
const SBTNS = [{ id: 'reset', x: 130, y: 450, w: 210, h: 44, label: 'RESET KEYS' }, { id: 'code', x: 375, y: 450, w: 210, h: 44, label: 'SECRET CODE' }, { id: 'back', x: 620, y: 450, w: 210, h: 44, label: 'BACK' }];
const CBTNS = [{ id: 'redeem', x: 270, y: 370, w: 200, h: 46, label: 'REDEEM' }, { id: 'cback', x: 490, y: 370, w: 200, h: 46, label: 'BACK' }];
const slotRect = (row, slot) => ({ x: 560 + slot * 150, y: 140 + row * 56, w: 130, h: 40 });
const inR = (b, px, py) => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
function openSettings() { state = 'settings'; listening = null; setRow = 0; setSlot = 0; }
function openCode() {
  state = 'code'; codeBuf = ''; codeMsg = '';
  if (codeIn) { codeIn.value = ''; try { codeIn.focus({ preventScroll: true }); } catch (e) {} }
}
function leaveCode() { state = 'settings'; if (codeIn) codeIn.blur(); cv.focus(); }
function doSBtn(id) {
  if (id === 'reset') { binds = JSON.parse(JSON.stringify(DEF_BINDS)); saveBinds(); beep(500, 0.1, 'triangle', 0.05, 200); }
  else if (id === 'code') openCode();
  else if (id === 'back') state = 'menu';
}
function redeem(raw) {
  const c = raw.trim().toLowerCase();
  codeBuf = ''; if (codeIn) codeIn.value = '';
  if (!c) return;
  if (!(c in CODES)) { codeMsg = 'Invalid code'; codeOk = false; beep(150, 0.2, 'sawtooth', 0.05, -40); return; }
  if (usedCodes[c]) { codeMsg = 'This code was already redeemed'; codeOk = false; beep(150, 0.2, 'sawtooth', 0.05, -40); return; }
  usedCodes[c] = true; try { localStorage.setItem('rr_codes', JSON.stringify(usedCodes)); } catch (e) {}
  coins += CODES[c]; saveWallet();
  codeMsg = 'Code accepted!  ● +' + CODES[c].toLocaleString() + ' coins'; codeOk = true;
  toastQ.push({ title: 'CODE REDEEMED!  ● +' + CODES[c].toLocaleString(), sub: 'Wallet ● ' + coins.toLocaleString() });
  beep(880, 0.25, 'triangle', 0.07, 600);
}
function settingsKey(e) {
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (listening) {
    const [a, s] = listening;
    if (k === 'Escape') { listening = null; return; }
    if (k === 'Backspace' || k === 'Delete') { binds[a][s] = ''; if (!binds[a][0] && !binds[a][1]) binds[a] = DEF_BINDS[a].slice(); saveBinds(); listening = null; return; }
    if (['Dead', 'Unidentified', 'Process'].includes(k)) return;
    bindKey(a, s, k); listening = null; beep(700, 0.06, 'triangle', 0.05, 200); return;
  }
  const rows = ACTIONS.length;
  if (k === 'Escape') { state = 'menu'; return; }
  if (k === 'ArrowUp') setRow = (setRow + rows) % (rows + 1);
  else if (k === 'ArrowDown') setRow = (setRow + 1) % (rows + 1);
  else if (k === 'ArrowLeft') setSlot = Math.max(0, setSlot - 1);
  else if (k === 'ArrowRight') setSlot = Math.min(setRow < rows ? 1 : 2, setSlot + 1);
  else if (k === 'Enter' || k === ' ') { if (setRow < rows) listening = [ACTIONS[setRow][0], setSlot]; else doSBtn(SBTNS[setSlot].id); }
  setSlot = Math.min(setSlot, setRow < rows ? 1 : 2);
}
function codeKey(e) {
  const k = e.key;
  if (k === 'Escape') { leaveCode(); return; }
  if (k === 'Enter') { e.preventDefault(); redeem(codeBuf); return; }
  if (codeIn && document.activeElement === codeIn) return;   // the hidden input feeds codeBuf through its 'input' event
  if (k === 'Backspace') codeBuf = codeBuf.slice(0, -1);
  else if (k.length === 1 && codeBuf.length < 16) codeBuf += k;
}
if (codeIn) codeIn.addEventListener('input', () => { codeBuf = codeIn.value.slice(0, 16); });

  leap:  { t: 'Leap {n} wide gaps',         tiers: [[4, 40], [10, 90], [20, 140]] },
  roll:  { t: 'Roll out of {n} big drops',  tiers: [[2, 40], [5, 80], [10, 120]] },
  dj:    { t: 'Double jump {n} times',      tiers: [[10, 30], [25, 60], [50, 100]] },
  abil:  { t: 'Use your ability {n} times', tiers: [[3, 40], [8, 80], [15, 130]] },
  combo: { t: 'Chain {n} style moves',      tiers: [[4, 50], [8, 100], [12, 160]] }
};
const QKEYS = Object.keys(QDEF);
let toast = null; const toastQ = [];
function genQuest(excl) {
  const pool = QKEYS.filter(k => !excl.includes(k));
  const m = pool[Math.floor(Math.random() * pool.length)];
  const r = Math.random(), ti = r < 0.5 ? 0 : r < 0.85 ? 1 : 2;
  const goal = QDEF[m].tiers[ti][0];
  return { m, goal, reward: [30, 60, 120][ti], prog: 0, done: false };
}
let quests = [];
try {
  const raw = JSON.parse(localStorage.getItem('rr_quests') || 'null');
  if (Array.isArray(raw) && raw.length === 3 && raw.every(q => QDEF[q.m] && q.goal > 0)) quests = raw;
} catch (e) {}
if (!quests.length) for (let i = 0; i < 3; i++) quests.push(genQuest(quests.map(q => q.m)));
function saveQuests() { try { localStorage.setItem('rr_quests', JSON.stringify(quests)); } catch (e) {} }
function refreshQuests() {
  for (let i = 0; i < 3; i++) if (quests[i].done) quests[i] = genQuest(quests.map(q => q.m));
  saveQuests();
}
function checkQuests() {
  for (const q of quests) if (!q.done && q.prog >= q.goal) {
    q.done = true; coins += q.reward; saveWallet(); saveQuests();
    const name = QDEF[q.m].t.replace('{n}', q.goal);
    if (g) { g.qdone.push(name + '  (+' + q.reward + ')'); g.questCoins += q.reward; }
    toastQ.push({ title: 'QUEST COMPLETE!  ● +' + q.reward, sub: name });
    beep(900, 0.3, 'triangle', 0.07, 500);
  }
}
function qAdd(m, n = 1) { if (twoP) return; for (const q of quests) if (!q.done && q.m === m) q.prog += n; checkQuests(); }
function qMax(m, v) { if (twoP) return; for (const q of quests) if (!q.done && q.m === m && v > q.prog) q.prog = v; checkQuests(); }

const keys = { down: false };
let AC = null;

/* ---------- helpers ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rnd(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function mixc(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * k), gg = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
  return `rgb(${r},${gg},${b})`;
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * 300, r: Math.random() * 2 + 0.8, p: Math.random() * 6 }));

function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

const RUN_DEF = { stride: 0.95, lift: 1.0, arm: 0.85, lean: 0, bob: 3, hop: 0, sync: 0, snap: 0, headWob: 0, armBack: 0, forearm: 1.2, crouch: 0, skate: 0, cad: 1 };
function poseVecRaw(pose, ph, spd, prof) {

    case 'run': {
      const P = Object.assign({}, RUN_DEF, prof);
      const q = P.snap ? Math.round(ph * P.snap) / P.snap : ph;
      const s = Math.sin(q), c = Math.cos(q), s2 = P.sync ? s : -s, c2 = P.sync ? c : -c;
      const leg = (s, c) => { const th = s * P.stride + 0.05; return [th, th - (0.12 + P.lift * Math.max(0, c))]; };
      const arm = s => { const th = -s * P.arm - P.armBack; return [th, th + P.forearm]; };

    }
    case 'slide':  return [-1.2, 22, 1.4, 1.5, 1.05, 0.15, -1.55, -1.9, -1.15, -1.5, -0.1, 0];
    case 'rise':   return [0.1, 0, 1.0, 0.0, -0.55, -1.4, 2.5, 2.3, 1.9, 2.1, -0.1, 0];
    case 'fall':   return [0.1, 0, 0.55, 0.45, -0.45, -0.55, 1.6, 2.0, -1.5, -1.8, 0.05, 0];
    case 'tuck':   return [0.55, 6, 1.6, -0.2, 1.4, -0.4, 1.0, 2.3, 0.8, 2.1, 0.3, 0];
    case 'vault':  return [0.85, 4, 1.35, 0.85, 1.1, 0.15, 0.55, 0.45, 0.35, 0.3, 0.2, 0];
    case 'layout': return [0.05, 0, 0.2, 0.1, -0.2, -0.1, 2.9, 2.95, 2.7, 2.8, -0.2, 0];
    case 'star':   return [0.0, 0, 0.8, 0.8, -0.8, -0.8, 1.7, 1.9, -1.7, -1.9, 0, 0];
    case 'cast':   return [0.15, 5, 0.7, 0.85, -0.4, -0.6, 2.0, 1.8, 2.5, 2.3, -0.15, 0];
    case 'hover':  return [0.04, 0, 0.25, 0.35, -0.2, 0.15, 1.0, 1.3, -1.0, -1.3, 0, 0];
    case 'sprint': return [0.78, 7, 1.3, 0.2, -1.1, -1.2, -1.4, -1.5, -1.2, -1.4, -0.1, 0];
    case 'land':   return [0.32, 10, 1.15, 1.35, 0.95, 1.25, 0.5, 0.95, 0.25, 0.8, 0.12, 0];
    case 'ko': {
      const f = ph;
      return [0.2 + 0.3 * Math.sin(f * 0.6), 0, 0.8 + 0.5 * Math.sin(f * 0.8), 0.4, -0.6 + 0.5 * Math.sin(f * 0.8 + 1), -0.4,
              2.4 + 0.6 * Math.sin(f), 2.8 + 0.5 * Math.sin(f + 0.7), -2.2 + 0.6 * Math.sin(f + 1.3), -2.6 + 0.5 * Math.sin(f + 2), 0.3 * Math.sin(f * 0.7), 0];

/* ---------- world ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function reset(ci = sel, seed = (Math.random() * 1e9) | 0) {
  const ch = levelStats(CHARS[ci], lvls[ci]);
  g = {
    ch, rng: mulberry32(seed), down: false, finalScore: 0, speed: 360, style: 0, chain: 0, comboT: 0, cam: 0, shake: 0, deadT: 0, dead: false, t: 0, newBest: false, ghostT: 0,
    p: { x: 0, y: 400, vy: 0, w: 26, grounded: true, jumpsLeft: 2, coyote: 0, buffer: 0, anim: 0, flipT: 0,
         slideOn: false, slideT: 0, airX: 0, airT: 0, rot: 0, jumpHeld: false, rollT: 0, vaultT: 0, sq: 0,
         pj: poseVec('run', 0, 360, ch.gait).slice(), castT: 0, sec: 0, secv: 0, step: 0 },
    plats: [{ x: -400, w: 1200, y: 400, ac: 300 }], obs: [], parts: [], pops: [], ghosts: [], coins: [], run: 0, bonus: 0, qdone: [], questCoins: 0, abCd: 0, abMax: 1,
    fx: { inv: 0, boost: 0, magnet: 0, coin2: 0, style2: 0, float: 0, glide: 0, slow: 0, ram: 0, shield: 0 }

  while (g.plats[g.plats.length - 1].x < 3000) genPlat();

}

function genPlat() { genPlatBase(); addCoins(); }
function addCoins() {
  const n = g.plats.length, pl = g.plats[n - 1], pv = g.plats[n - 2];
  if (!pv) return;
  if (g.rng() < 0.55) {              // arc of gems over the gap
    const x0 = pv.x + pv.w, x1 = pl.x, cnt = 5;
    for (let i = 0; i < cnt; i++) {
      const t = (i + 0.5) / cnt, base = pv.y + (pl.y - pv.y) * t;
      g.coins.push({ x: x0 + (x1 - x0) * t, y: base - 50 - Math.sin(Math.PI * t) * 90, got: false, ph: g.rng() * 6 });
    }
  }
  if (g.rng() < 0.65) {              // row of gems on the rooftop, arcing over obstacles
    const obs = g.obs.filter(o => o.x >= pl.x && o.x <= pl.x + pl.w);
    const start = pl.x + 40 + g.rng() * 60, cnt = 4 + Math.floor(g.rng() * 6);
    for (let i = 0; i < cnt; i++) {
      const x = start + i * 38;
      if (x > pl.x + pl.w - 20) break;
      let y = pl.y - 36;
      for (const o of obs) if (o.solid && x > o.x - 24 && x < o.x + o.w + 24) y = Math.min(y, o.top - 40);
      g.coins.push({ x, y, got: false, ph: g.rng() * 6 });

}
function genPlatBase() {
  const last = g.plats[g.plats.length - 1];
  const gap = 100 + g.rng() * Math.min(130, Math.min(760, 360 + last.x / 55) * 0.3);
  let y = last.y + (g.rng() * 150 - 80);
  y = clamp(y, 320, 440);
  const w = 240 + g.rng() * 460;
  const pl = { x: last.x + last.w + gap, w, y, ac: g.rng() < 0.45 ? Math.floor(g.rng() * (w - 80)) : -1 };
  g.plats.push(pl);
  if (w >= 340) {
    let x = pl.x + 170;
    while (x < pl.x + w - 140) {
      if (g.rng() < 0.8) {
        const r = g.rng(); let o;
        if (r < 0.3) o = { type: 'crate', x, w: 54, top: pl.y - 54, bot: pl.y, solid: true };
        else if (r < 0.55) o = { type: 'wall', x, w: 26, top: pl.y - 92, bot: pl.y, solid: true };
        else if (r < 0.75) o = { type: 'rail', x, w: 76, top: pl.y - 34, bot: pl.y, solid: true };
        else o = { type: 'bar', x, w: 96, top: pl.y - 260, bot: pl.y - 58, solid: false };
        o.done = false; g.obs.push(o);
        x += o.w + 220 + g.rng() * 120;

}

function dust(x, y, n, col = 'rgba(255,230,200,0.7)') {
  for (let i = 0; i < n; i++) g.parts.push({ x, y, vx: (Math.random() - 0.7) * 140, vy: -Math.random() * 90, life: 0.4 + Math.random() * 0.3, max: 0.7, size: 2 + Math.random() * 3, col });
}
function sparks(x, y, n) {
  for (let i = 0; i < n; i++) g.parts.push({ x, y, vx: -60 - Math.random() * 160, vy: -Math.random() * 140, life: 0.25 + Math.random() * 0.2, max: 0.45, size: 2, col: '#ffcf70' });
}
function addStyle(pts, label, extra = 1) {

}

  for (let i = 0; i < 6; i++) g.parts.push({ x: g.p.x - g.cam + 13, y: g.p.y - 80, vx: (Math.random() - 0.5) * 160, vy: -80 - Math.random() * 80, life: 0.9, max: 0.9, size: 3, col: '#ffd23f', glyph: '★', grav: 0.6 });

}

    case 'pony':     if (em(30)) sp(sx - 8, by + R() * 40, '#7ff0ff', -70, 0, 0.6, 2.5); break;

function smash(o) {

}

  const f = g.fx;

    f.shield = 0; f.inv = 1.2; g.shake = 10;
    sparks(g.p.x - g.cam + 13, g.p.y - 40, 14);
    g.pops.push({ x: g.p.x - g.cam + 10, y: g.p.y - 110, t: 0, txt: 'SHIELD BROKE', col: '#7fe6ff' });
    beep(300, 0.25, 'sawtooth', 0.07, -150);

  }

}
function useAbility() {

  const launch = vy => { if (p.grounded) { p.airX = p.x; p.airT = 0; } p.vy = vy; p.grounded = false; p.coyote = 0; p.slideOn = false; p.rollT = 0; };
  switch (ab.id) {
    case 'dash':   f.inv = 1.0 * M; f.boost = 0.9 * M; break;
    case 'sky':    launch(-900 * (1 + (M - 1) * 0.35)); p.jumpsLeft = 1; p.flipT = 0.001; break;
    case 'over':   f.style2 = 7 * M; break;
    case 'shield': f.shield = 10 * M; break;
    case 'mega':   launch(-1180 * (1 + (M - 1) * 0.25)); p.jumpsLeft = 1; break;
    case 'jet':    f.float = 1.8 * M; p.jumpsLeft = Math.max(p.jumpsLeft, 1); break;
    case 'phase':  f.inv = 2.2 * M; break;
    case 'carrot': f.coin2 = 8 * M; break;
    case 'shock':
      for (const o of g.obs) if (!o.gone && o.x > p.x && o.x < p.x + 460 * M) { o.gone = true; smash(o); }
      for (let i = 0; i < 24; i++) g.parts.push({ x: p.x - g.cam + 13, y: p.y - 6, vx: 120 + Math.random() * 420, vy: -Math.random() * 60, life: 0.45, max: 0.45, size: 3, col: '#ff2d95' });
      break;
    case 'ram':    f.ram = 3 * M; break;
    case 'magnet': f.magnet = 8 * M; break;
    case 'slow':   f.slow = 3.2 * M; break;
    case 'glide':  f.glide = 4 * M; break;
    case 'tax':
      for (const c of g.coins) if (!c.got && c.x > p.x - 40 && c.x < p.x + 900 * M) {
        c.got = true; g.run++; g.style += 3; qAdd('coins'); dust(c.x - g.cam, c.y, 3, '#5fe3ff');
      }
      break;

  g.pops.push({ x: p.x - g.cam + 10, y: p.y - 125, t: 0, txt: ab.name.toUpperCase() + '!', col: '#fff' });
  p.castT = 0.32;
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; g.parts.push({ x: p.x - g.cam + 13, y: p.y - 42, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 0.4, max: 0.4, size: 3, col: g.ch.acc === '#3b2a1a' ? '#ffd23f' : g.ch.acc, grav: 0 }); }
}

function onLand(impact) {
  const p = g.p;
  p.flipT = 0; p.vaultT = 0;
  p.sq = clamp(impact / 1200, 0.15, 1);
  dust(p.x - g.cam + 13, p.y, p.airT > 0.35 ? 10 : 4);
  beep(110, 0.07, 'triangle', 0.05, -30);
  if (impact > g.ch.rollImpact && !p.slideOn) { p.rollT = 0.001; addStyle(15, 'ROLL'); }
  if (p.x - p.airX >= 210 && p.airT > 0.3) addStyle(25, 'LEAP', g.ch.leapMul);
}

function curPose() {
  const p = g.p, f = g.fx;
  if (g.dead) return 'ko';
  if (p.castT > 0) return 'cast';
  if (p.rollT > 0) return 'tuck';
  if (p.slideOn) return 'slide';
  if (!p.grounded) {
    if (p.flipT > 0) return g.ch.flip.pose;
    if (f.float > 0 || f.glide > 0) return 'hover';
    if (p.vaultT > 0) return 'vault';
    return p.vy < 0 ? 'rise' : 'fall';
  }
  if (f.boost > 0) return 'sprint';
  if (p.sq > 0.3) return 'land';
  return 'run';
}
function bodyXform() {
  const p = g.p, fl = g.ch.flip;
  if (g.dead) return [p.rot, 40];
  if (p.rollT > 0) return [(p.rollT / 0.38) * Math.PI * 2, 24];
  if (p.flipT > 0) return [fl.dir * fl.turns * (p.flipT / 0.5) * Math.PI * 2, 42];
  return [0, 40];
}
function animate(dt) {
  const p = g.p, ch = g.ch, pose = curPose();
  const ph = pose === 'ko' ? g.deadT * 18 : p.anim;
  const tgt = poseVec(pose, ph, g.speed, ch.gait), k = 1 - Math.exp(-dt * (pose === 'run' ? 30 : pose === 'ko' ? 40 : 22));
  for (let i = 0; i < tgt.length; i++) p.pj[i] += (tgt[i] - p.pj[i]) * k;
  p.sq *= Math.exp(-dt * 11);
  // spring-driven secondary motion for hair / scarves / capes: lags behind vertical movement and overshoots
  const target = clamp(-p.vy * 0.012, -12, 12);
  p.secv += ((target - p.sec) * 160 - p.secv * 9) * dt; p.sec += p.secv * dt;
  p.castT = Math.max(0, p.castT - dt);
  g.ghostT -= dt;
  if ((p.flipT > 0 || p.rollT > 0 || g.fx.boost > 0) && g.ghostT <= 0 && !g.dead) {
    const [rot, cy] = bodyXform();
    g.ghosts.push({ x: p.x + p.w / 2, y: p.y, v: p.pj.slice(), rot, cy, life: 0.3 });
    g.ghostT = 0.04;
  }
}

/* ---------- update ---------- */
function update(dt) {
  g.t += dt;
  const p = g.p, ch = g.ch;

  if (g.dead) {
    g.deadT += dt; p.rot += dt * 9; p.vy += GRAV * dt; p.y += p.vy * dt;
    p.x += Math.max(0, g.speed * 0.35 * (1 - g.deadT * 1.5)) * dt;
    if (g.deadT > 0.9 && state === 'play' && !twoP) { state = 'over'; overT = 0; }
  } else {
    g.speed = Math.min(760, 360 + (p.x / 55) * ch.ramp);
    for (const k in g.fx) g.fx[k] = Math.max(0, g.fx[k] - dt);
    g.abCd = Math.max(0, g.abCd - dt);
    const spd = g.speed * (g.fx.slow > 0 ? 0.55 : 1) + (g.fx.boost > 0 ? 300 : 0);
    p.buffer = Math.max(0, p.buffer - dt);
    if (p.grounded) { p.coyote = ch.coy; p.jumpsLeft = 2; }
    else { p.coyote -= dt; if (p.coyote <= 0 && p.jumpsLeft > 1) p.jumpsLeft = 1; }

    if (p.buffer > 0) {
      if (p.coyote > 0) {
        p.vy = -JUMP * ch.jump; p.grounded = false; p.coyote = 0; p.jumpsLeft = 1; p.buffer = 0;
        p.slideOn = false; p.rollT = 0; p.jumpHeld = true; p.airT = 0; p.airX = p.x;
        dust(p.x - g.cam + 13, p.y, 5); beep(440, 0.1, 'square', 0.05, 300);
      } else if (p.jumpsLeft > 0) {
        qAdd('dj'); p.vy = -JUMP2 * ch.jump2; p.jumpsLeft = 0; p.flipT = 0.001; p.buffer = 0; p.jumpHeld = false; p.vaultT = 0;
        beep(620, 0.12, 'triangle', 0.06, 400);
      }
    }
    if (p.flipT > 0) { p.flipT += dt; if (p.flipT > 0.5) p.flipT = 0; }

  if (state === 'play' && twoP) {
    if (Math.hypot(px - W / 2, py - 270) < 28) { togglePause(); return; }
    if (paused) return;
    const i = py < 270 ? 0 : 1;
    if (Math.hypot(px - (W - 40), py - (i * 270 + 230)) < 34) { abilityFor(i); return; }
    pointers.set(e.pointerId, { z2: true, i, slide: px < W / 2, t0: performance.now() });
    if (px < W / 2) G2[i].down = true;
    return;
  }
  if (state === 'menu' && (px < 55 || px > W - 55) && py > 110 && py < 300) { select(px < 55 ? Math.floor(sel / 5) * 5 - 5 : Math.floor(sel / 5) * 5 + 5); return; }
  if (state === 'quests') { state = 'menu'; return; }
  if (state === 'menu' && px < 190 && py < 64) { state = 'quests'; return; }
  if (state === 'menu' && px < 190 && py >= 64 && py < 110) { openSettings(); return; }
  if (state === 'menu' && px >= 760 && py >= 62 && py < 108) { toggle2P(); return; }
  if (state === 'menu' && ownedArr[sel] && inR(UPG_RECT, px, py)) { upgradeSel(); return; }
  if (state === 'menu') {
    for (let i = 0; i < CHARS.length; i++) {
      const c = cardRect(i); if (Math.floor(i / 5) !== Math.floor(sel / 5)) continue;
      if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) { if (i === sel) startOrBuy(); else select(i); return; }
    }
    startOrBuy(); return;
  }
  if (state === 'play' && Math.hypot(px - (W - 44), py - 40) < 30) { togglePause(); return; }
  if (state === 'play' && !paused && Math.hypot(px - (W - 66), py - (H - 66)) < 52) { useAbility(); return; }
  const left = px < W / 2;
  if (e.pointerType === 'touch' && left && state === 'play') { pointers.set(e.pointerId, 'slide'); keys.down = true; }
  else {
    if (state === 'play' && !paused) {
      const nowT = performance.now();
      if (nowT - lastTapT < DBL_MS) { lastTapT = 0; pointers.set(e.pointerId, 'none'); useAbility(); return; }   // quick double-tap = special move
      lastTapT = nowT;
    }
    pointers.set(e.pointerId, 'jump'); pressJump();
  }
});
function ptrUp(e) {
  const t = pointers.get(e.pointerId); pointers.delete(e.pointerId);
  if (t && t.z2) {
    const i = t.i, now = performance.now(), short = now - t.t0 < 260;
    if (t.slide && G2[i]) G2[i].down = false;
    if (state === 'play' && twoP && !paused) {
      if (short && now - lastTap2[i] < DBL_MS) { lastTap2[i] = 0; abilityFor(i); }
      else { if (short) lastTap2[i] = now; if (!t.slide) jumpFor(i); }
    }
    return;
  }
  if (t === 'slide') keys.down = false; else if (t === 'jump') releaseJump();
}
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
addEventListener('blur', () => { keys.down = false; G2.forEach(x => { x.down = false; }); saveQuests(); if (state === 'play') paused = true; });

function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts;
  if (!toast && toastQ.length) toast = Object.assign(toastQ.shift(), { t: 3.2 });
  if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (state === 'play' && !paused) { if (twoP) update2(dt); else update(dt); }
  else if (state === 'menu' || state === 'quests' || state === 'settings' || state === 'code') { menuT += dt; g.t += dt; }
  else if (state === 'over') { overT += dt; g.t += dt; update(dt); }
  else if (state === 'over2') { overT += dt; }
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
})();
